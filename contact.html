<!DOCTYPE html>
<html lang="en">

    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <header>
        <h1>Apna Punjab</h1>
        <p>All Things Punjabi In Your Local Area</p>
        <nav>
            <ul>
                <li><a href="index.html">Home / About</a></li>
                <li><a href="thingstodo.html">Things To Do</a></li>
                <li><a href="localbusiness.html">Local Businesses</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

   


    <!-- Contact Us -->
    <section id="contact" class="vibrant-bg">
        <h2>Contact Us</h2>
        <p>If you have a query or would like to advertise a business or an event with us please complete the form below.</p>

        <!-- Sign-Up Form -->
        <form class="contact-form" action="#" method="post">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="query">Your Query:</label>
            <textarea id="query" name="query" rows="4" required></textarea>

            <label for="interest">I'm Interested In:</label>
            <select id="interest" name="interest">
                <option value="Query">Query</option>
                <option value="advertising">Advertising my Business</option>
                <option value="events">Featuring my Event</option>
            </select>

            <button type="submit">Submit</button>
        </form>
    </section>

    <footer>
        <p>&copy; 2024 Apna Punjab. All rights reserved.</p>
        <div class="social-media">
            <a href="#"><img src="images/instagram.png" alt="Instagram"></a>
            <a href="#"><img src="images/facebook.png" alt="Facebook"></a>
            <a href="#"><img src="images/email.png" alt="Email"></a>
        </div>
    </footer>

</body>
</html>
